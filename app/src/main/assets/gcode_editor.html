<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #1a1a1a; }
        #editor { margin: 0; position: absolute; top: 0; bottom: 0; left: 0; right: 0; font-size: 14px; }
    </style>
<!-- Caricamento LOCALE dei file per l'uso in officina senza internet -->
<script src="js/ace.js"></script>
<script src="js/mode-gcode.js"></script>
<script src="js/theme-tomorrow_night.js"></script>
<script src="js/ext-searchbox.js"></script>
</head>
<body>

<div id="editor"></div>

<script>
    var editor = ace.edit("editor");
    editor.setTheme("ace/theme/tomorrow_night");
    editor.session.setMode("ace/mode/gcode");
    // Parte in read-only: Android abilita l'editing solo quando la macchina è IDLE
    editor.setReadOnly(true);

    // Ottimizzazioni per performance estreme con >100k righe
    editor.setOption("useWorker", false); // Disattiva i controlli sintattici in background per evitare lag
    editor.session.setUseWrapMode(false); // Disattiva il wrapping per velocizzare il rendering verticale

    // Interfaccia di comunicazione con Android
    function setGcodeContent(text) {
        editor.setValue(text, -1); // -1 sposta il cursore all'inizio
    }

    function getGcodeContent() {
        return editor.getValue();
    }

    function openSearch() {
        editor.execCommand("find");
    }

    // Posiziona il cursore su una riga (1-based) e la centra: usato dal
    // "Run from line" per portare l'utente alla riga di ripartenza.
    function gotoLine(n) {
        try {
            n = parseInt(n, 10);
            if (isNaN(n) || n < 1) return;
            editor.gotoLine(n, 0, true);
            editor.scrollToLine(n, true, true, function () {});
            editor.selection.selectLine();
            editor.focus();
        } catch (e) {}
    }

    // Toggle modalità sola lettura: chiamata da Android in base allo stato macchina
    function setEditorReadOnly(flag) {
        editor.setReadOnly(!!flag);
    }
</script>
</body>
</html>
